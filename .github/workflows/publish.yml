# npm Trusted Publishing: tag-push releases via GitHub Actions OIDC.
#
# One-time binding (npmjs.com → package dsh-quota → Settings → Trusted
# Publisher → GitHub Actions):
#   Organization or user: Minokun
#   Repository:           dsh-quota
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#
# Release flow: `npm version patch && git push --follow-tags` (or
# scripts/release.sh) — this workflow builds and publishes; no token, no OTP.
name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires GitHub-hosted runners
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the release-notes commit range

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing requires npm CLI >= 11.5.1.
      - name: Latest npm CLI
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # tsdown host+client build, including the client-id consistency gate.
      - run: pnpm build

      # OIDC is auto-detected in GitHub Actions; provenance is generated
      # automatically for trusted publishes. No token/OTP needed.
      - run: npm publish --access public

      # GitHub Release with notes from the commit subjects since the previous
      # tag (--generate-notes stays empty for direct-push repos without PRs).
      # Runs after the npm publish so a failed publish never leaves a release
      # pointing at nothing.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          range=${prev:+$prev..}$TAG
          notes=$(git log --format='- %s' "$range" | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+$' || true)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${TAG}"
